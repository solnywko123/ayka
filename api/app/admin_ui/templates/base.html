<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Админка{% endblock %} — Ayka Cleaning</title>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
{% if admin %}
<div class="topbar">
  <strong>Ayka Cleaning — админка</strong>
  <nav>
    <a href="/admin" class="{{ 'active' if request.url.path == '/admin' }}">Дашборд</a>
    <a href="/admin/leads" class="{{ 'active' if request.url.path.startswith('/admin/leads') }}">Заявки</a>
    <a href="/admin/logout">Выйти ({{ admin }})</a>
  </nav>
</div>
{% endif %}
<div class="container">
{% block content %}{% endblock %}
</div>
<script src="/admin/static/admin.js"></script>
</body>
</html>
