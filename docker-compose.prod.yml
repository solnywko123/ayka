# Альтернатива Netlify/Render — деплой на собственный VPS.
# Использование: docker compose -f docker-compose.prod.yml up -d --build
# Обязательно создайте .env в корне репозитория (см. .env.example) перед запуском —
# все секреты ниже читаются из окружения хоста, а не хранятся в этом файле.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayka}
      POSTGRES_USER: ${POSTGRES_USER:-ayka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ayka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayka}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BUILD_ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ayka}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ayka}
      PRICING_PATH: site/content/pricing.json
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required — run make hash-password}
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required, e.g. https://example.kg}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

  # Пересобирает site/dist на хосте: docker compose -f docker-compose.prod.yml run --rm site-builder
  site-builder:
    build:
      context: .
      dockerfile: site/Dockerfile
    volumes:
      - ./site/dist:/app/site/dist
    profiles: ["build"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site/dist:/srv/site:ro
      - ayka_caddy_data:/data
      - ayka_caddy_config:/config

volumes:
  ayka_postgres_data:
  ayka_caddy_data:
  ayka_caddy_config:
